# Included by nginx inside http {}. Empty keys do not consume a rate-limit slot.
map $request_method $hypernet_write_key {
    default $binary_remote_addr;
    GET "";
    HEAD "";
    OPTIONS "";
}
map "$request_method:$uri:$http_next_action" $hypernet_form_key {
    default "";
    ~^POST:/contact/?: $binary_remote_addr;
    ~^POST:/(?:admin|api)(?:/|:|$) "";
    ~^POST:[^:]*:.+ $binary_remote_addr;
}
map "$request_method:$uri" $hypernet_auth_key {
    default "";
    ~^POST:/api/users/(login|forgot-password|reset-password)/?$ $binary_remote_addr;
}
limit_req_zone $hypernet_write_key zone=hypernet_writes:10m rate=60r/m;
limit_req_zone $hypernet_form_key zone=hypernet_forms:10m rate=6r/m;
limit_req_zone $hypernet_auth_key zone=hypernet_auth:10m rate=5r/m;

# Avoid retaining preview secrets and query strings in access logs.
log_format hypernet_privacy '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
