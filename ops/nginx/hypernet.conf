server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name hypernet.co.za www.hypernet.co.za;
    return 301 https://hypernet.co.za$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.hypernet.co.za;
    ssl_certificate /etc/letsencrypt/live/hypernet.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hypernet.co.za/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://hypernet.co.za$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hypernet.co.za;
    ssl_certificate /etc/letsencrypt/live/hypernet.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hypernet.co.za/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/hypernet-access.log hypernet_privacy;
    client_max_body_size 20m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_req_status 429;
    limit_req zone=hypernet_writes burst=30 nodelay;
    limit_req zone=hypernet_forms burst=5 nodelay;
    limit_req zone=hypernet_auth burst=5 nodelay;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;
    location ~ /\.(?!well-known(?:/|$)) { return 404; }
    location ~* \.(?:db|sqlite|sqlite3|sql|bak|log|env)(?:$|/) { return 404; }
    location = /api/graphql { return 404; }
    location = /api/graphql-playground { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace visitor-supplied forwarding headers with the actual peer.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cookie_flags payload-token secure httponly samesite=lax;
    }
}
