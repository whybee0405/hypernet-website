# Enable with:
#   sudo install -m 644 deploy/nginx/hypernet.cloudia.co.za.conf /etc/nginx/sites-available/hypernet.cloudia.co.za
#   sudo ln -s /etc/nginx/sites-available/hypernet.cloudia.co.za /etc/nginx/sites-enabled/hypernet.cloudia.co.za
#   sudo nginx -t && sudo systemctl reload nginx
#
# After the DNS A record points to this host, run:
#   sudo certbot --nginx --redirect -d hypernet.cloudia.co.za

server {
    listen 80;
    listen [::]:80;
    server_name hypernet.cloudia.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        # TLS terminates here, so mark the upstream auth cookie HTTPS-only.
        proxy_cookie_flags payload-token secure httponly samesite=lax;
    }
}
